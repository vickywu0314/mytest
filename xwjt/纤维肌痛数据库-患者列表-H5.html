<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>纤维肌痛数据库</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f7f8fa;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
button,input{font:inherit}body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.app-header{position:sticky;top:0;z-index:30;height:52px;background:#fff;border-bottom:1px solid #e6eaf0;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:0 4px}
.app-title{text-align:center;font-size:17px;font-weight:650;color:#111827;white-space:nowrap}.back-btn{width:44px;height:44px;border:0;background:transparent;color:#374151;display:grid;place-items:center;border-radius:9px;padding:0;cursor:pointer}.back-btn:active{background:#f2f4f8}.header-space{width:48px}
main{max-width:680px;margin:auto;padding:16px 14px 92px}.sub{font-size:13px;color:#8a93a3;line-height:1.6}
.searchbox{height:44px;background:#fff;border:1px solid #dfe4ec;border-radius:10px;display:flex;align-items:center;gap:9px;padding:0 12px;margin-bottom:14px}.searchbox svg{color:#8a93a3;flex:none}.searchbox input{border:0;outline:0;min-width:0;flex:1;color:#374151;background:transparent}.searchbox input::placeholder{color:#a7afbc}
.list{display:flex;flex-direction:column;gap:10px}.card{width:100%;background:#fff;border:1px solid #e6eaf0;border-radius:14px;padding:16px;text-align:left;color:#111827;cursor:pointer}.card:active{background:#fafbfc;transform:scale(.995)}
.rowtop{display:flex;align-items:center;gap:10px}.name{font-size:17px;font-weight:700;flex:1}.chev{font-size:24px;color:#1257c4;line-height:1}.meta{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:12px;color:#8a93a3}.meta span:last-child{white-space:nowrap}
.fabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,#f7f8fa 70%,rgba(247,248,250,0))}
.primary{display:block;width:min(100%,652px);height:46px;margin:auto;border:0;border-radius:9px;background:#0b57d0;color:#fff;font-weight:650;box-shadow:0 5px 14px rgba(11,87,208,.18);cursor:pointer}
.visit-card{min-height:76px;display:flex;align-items:center}.visit-date{font-size:16px;font-weight:700;flex:1}.visit-label{font-size:11px;color:#8a93a3;margin-bottom:4px}.empty{padding:40px 12px;text-align:center;color:#8a93a3;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom));transform:translate(-50%,15px);background:#111827;color:#fff;font-size:12px;padding:9px 13px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:60;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body>
<header class="app-header"><button class="back-btn" id="backBtn" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><div class="app-title">纤维肌痛数据库</div><div class="header-space"></div></header>
<main><div class="searchbox"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="search" placeholder="请输入患者姓名进行搜索..." autocomplete="off"></div>
<div class="list" id="patientList"><button class="card patient-row" data-name="张三"><div class="rowtop"><div class="name">张三</div><div class="chev">›</div></div><div class="meta"><span>上次新增记录时间：2020-11-04</span><span>已添加2条</span></div></button>
<button class="card patient-row" data-name="李四"><div class="rowtop"><div class="name">李四</div><div class="chev">›</div></div><div class="meta"><span>上次新增记录时间：2020-11-04</span><span>已添加2条</span></div></button>
<button class="card patient-row" data-name="王敏"><div class="rowtop"><div class="name">王敏</div><div class="chev">›</div></div><div class="meta"><span>上次新增记录时间：2020-10-28</span><span>已添加5条</span></div></button>
<button class="card patient-row" data-name="赵丽"><div class="rowtop"><div class="name">赵丽</div><div class="chev">›</div></div><div class="meta"><span>上次新增记录时间：2020-10-21</span><span>已添加3条</span></div></button>
<button class="card patient-row" data-name="陈晓"><div class="rowtop"><div class="name">陈晓</div><div class="chev">›</div></div><div class="meta"><span>上次新增记录时间：2020-10-09</span><span>已添加4条</span></div></button>
<button class="card patient-row" data-name="刘芳"><div class="rowtop"><div class="name">刘芳</div><div class="chev">›</div></div><div class="meta"><span>上次新增记录时间：2020-09-30</span><span>已添加2条</span></div></button>
<button class="card patient-row" data-name="周宁"><div class="rowtop"><div class="name">周宁</div><div class="chev">›</div></div><div class="meta"><span>上次新增记录时间：2020-09-18</span><span>已添加6条</span></div></button></div><div class="empty" id="empty" style="display:none">没有找到匹配的患者</div></main>
<div class="fabbar"><button class="primary" id="addPatient">新增患者资料</button></div><div class="toast" id="toast"></div>
<script>
const rows=[...document.querySelectorAll(".patient-row")],empty=document.getElementById("empty"),toast=document.getElementById("toast");
function tip(t){toast.textContent=t;toast.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>toast.classList.remove("show"),1500)}
backBtn.onclick=()=>location.href="./研究平台-APP内嵌H5-v3.html";
rows.forEach(r=>r.onclick=()=>location.href="./纤维肌痛数据库-随访记录-H5.html?name="+encodeURIComponent(r.dataset.name));
search.oninput=e=>{let q=e.target.value.trim();let n=0;rows.forEach(r=>{let show=!q||r.dataset.name.includes(q);r.style.display=show?"":"none";if(show)n++});empty.style.display=n?"none":"block"};
addPatient.onclick=()=>location.href="./纤维肌痛数据库-新增患者-H5.html";
</script></body></html>
