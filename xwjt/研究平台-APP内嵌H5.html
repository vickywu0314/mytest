<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>研究平台</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f7f8fa;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
button,input{font:inherit}body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.topbar{position:sticky;top:0;z-index:30;height:62px;background:rgba(255,255,255,.97);border-bottom:1px solid #e6eaf0;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:36px;height:36px;border-radius:9px;background:#0b57d0;color:#fff;display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}.brand-cn{font-size:14px;font-weight:700;white-space:nowrap}.brand-en{font-size:10px;color:#8a93a3;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.iconbtn{width:40px;height:40px;border:0;background:transparent;border-radius:9px;display:grid;place-items:center;color:#374151}
main{max-width:680px;margin:auto;padding:22px 14px 42px}.eyebrow{font-size:13px;color:#8a93a3}h1{font-size:25px;line-height:1.25;margin:6px 0 0;letter-spacing:-.4px}.sub{font-size:13px;color:#8a93a3;margin-top:7px;line-height:1.6}
.entry-card{margin-top:20px;background:#fff;border:1px solid #e6eaf0;border-radius:14px;padding:18px}.entry-title{font-size:16px;font-weight:700}.entry-note{font-size:12px;color:#8a93a3;line-height:1.55;margin-top:6px}
.input-row{display:flex;margin-top:15px;height:44px}.input-row input{min-width:0;flex:1;border:1px solid #dfe4ec;border-right:0;border-radius:9px 0 0 9px;padding:0 12px;outline:0;color:#374151;background:#fff}.input-row input:focus{border-color:#0b57d0}.enter{width:82px;border:0;border-radius:0 9px 9px 0;background:#0b57d0;color:#fff;font-weight:650;cursor:pointer}
.skip{display:flex;align-items:center;gap:6px;margin-top:11px;color:#8a93a3;font-size:11px}
.section{margin-top:27px}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:12px}.section-title{font-size:18px;font-weight:700}.section-note{font-size:11px;color:#8a93a3}
.platform-list{display:flex;flex-direction:column;gap:10px}.platform{width:100%;border:1px solid #e6eaf0;background:#fff;border-radius:14px;padding:15px 14px;display:flex;align-items:center;gap:13px;text-align:left;cursor:pointer;color:#111827;transition:.15s}.platform:active{transform:scale(.992);background:#fafbfc}
.picon{width:42px;height:42px;border-radius:11px;background:#eaf1fd;color:#1257c4;display:grid;place-items:center;flex:none}.picon svg{width:23px;height:23px}.pbody{min-width:0;flex:1}.pname{font-size:15px;font-weight:700}.pdesc{font-size:11px;color:#8a93a3;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chev{color:#a0a7b4;font-size:23px;font-weight:300}
.other{margin-top:18px;background:#fff;border:1px solid #e6eaf0;border-radius:14px;padding:15px 16px}.other-title{font-size:13px;font-weight:650}.other-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tag{font-size:11px;color:#6b7280;background:#f2f4f8;border-radius:999px;padding:6px 9px}
.overlay{position:fixed;inset:0;background:rgba(17,24,39,.28);z-index:49;opacity:0;pointer-events:none;transition:.2s}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(82vw,320px);background:#fff;z-index:50;transform:translateX(100%);transition:.22s ease;padding:calc(18px + env(safe-area-inset-top)) 16px 20px;box-shadow:-12px 0 32px rgba(17,24,39,.12)}
body.menu .overlay{opacity:1;pointer-events:auto}body.menu .drawer{transform:none}.drawer-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid #e6eaf0}.drawer-title{font-size:15px;font-weight:700}.drawer-en{font-size:10px;color:#8a93a3;margin-top:3px}.navitem{height:48px;display:flex;align-items:center;padding:0 12px;border-radius:9px;margin-top:7px;font-size:14px;font-weight:600;color:#374151}.navitem.active{background:#eaf1fd;color:#1257c4}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,15px);background:#111827;color:#fff;font-size:12px;padding:9px 13px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:60;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:360px){main{padding-left:12px;padding-right:12px}.brand-en{max-width:170px}.platform{padding-left:12px;padding-right:12px}}

.app-header{position:sticky;top:0;z-index:30;height:52px;background:#fff;border-bottom:1px solid #e6eaf0;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:0 4px}
.app-title{text-align:center;font-size:17px;font-weight:650;color:#111827;white-space:nowrap}
.back-btn{width:44px;height:44px;border:0;background:transparent;color:#374151;display:grid;place-items:center;border-radius:9px;padding:0;cursor:pointer}
.back-btn:active{background:#f2f4f8}
.header-space{width:48px}

</style>
</head>
<body>





<header class="app-header">
  <button class="back-btn" id="backBtn" aria-label="返回">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
  </button>
  <div class="app-title">研究平台</div>
  <div class="header-space"></div>
</header>

<main>
 <div class="sub" style="margin-top:0">输入研究序列号进入对应研究；没有序列号也可以直接选择下方数据库。</div>

 <section class="entry-card">
  <div class="entry-title">研究序列号</div>
  <div class="entry-note">已有研究序列号时，可快速定位并进入对应研究项目。</div>
  <div class="input-row"><input id="serial" placeholder="请输入研究序列号" autocomplete="off"><button class="enter" id="enterBtn">进入</button></div>
  <div class="skip"><span>●</span><span>没有序列号？可直接从下方选择数据库</span></div>
 </section>

 <section class="section">
  <div class="section-head"><div class="section-title">数据库快捷入口</div><div class="section-note">选择研究类型</div></div>
  <div class="platform-list">
   <button class="platform" data-name="RA研究数据平台"><span class="picon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M8 3h8v4l3 3v9a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-9l3-3V3Z"/><path d="M9 13h6M12 10v6"/></svg></span><span class="pbody"><span class="pname">RA 研究数据平台</span><span class="pdesc">Rheumatoid Arthritis · 类风湿关节炎</span></span><span class="chev">›</span></button>
   <button class="platform" data-name="AS研究数据平台"><span class="picon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 3v18M8 5h8M7 9h10M7 13h10M8 17h8"/></svg></span><span class="pbody"><span class="pname">AS 研究数据平台</span><span class="pdesc">Ankylosing Spondylitis · 强直性脊柱炎</span></span><span class="chev">›</span></button>
   <button class="platform" data-name="SS研究数据平台"><span class="picon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="8" r="3"/><path d="M6 20c.5-5 2.5-7 6-7s5.5 2 6 7M4 8h2M18 8h2M12 2v2"/></svg></span><span class="pbody"><span class="pname">SS 研究数据平台</span><span class="pdesc">Sjögren's Syndrome · 干燥综合征</span></span><span class="chev">›</span></button>
   <button class="platform" data-name="RA-ILD研究数据平台"><span class="picon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M11 5v14c-3 2-7 0-7-4 0-5 3-8 7-10ZM13 5v14c3 2 7 0 7-4 0-5-3-8-7-10Z"/></svg></span><span class="pbody"><span class="pname">RA-ILD 研究数据平台</span><span class="pdesc">RA-associated Interstitial Lung Disease</span></span><span class="chev">›</span></button>
   <button class="platform" data-name="RA肌少症研究数据平台"><span class="picon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="5" r="2"/><path d="M8 10c1-2 2-3 4-3s3 1 4 3l2 4-3 1-1-3v8h-4v-8l-1 3-3-1 2-4Z"/></svg></span><span class="pbody"><span class="pname">RA 肌少症研究数据平台</span><span class="pdesc">Rheumatoid Arthritis & Sarcopenia</span></span><span class="chev">›</span></button>
   <button class="platform" data-name="纤维肌痛研究数据平台" id="fibroPlatform"><span class="picon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M5 12c3-5 5-7 7-7s4 2 7 7c-3 5-5 7-7 7s-4-2-7-7Z"/><path d="M9 12h6"/></svg></span><span class="pbody"><span class="pname">纤维肌痛研究数据平台</span><span class="pdesc">Fibromyalgia Research Database</span></span><span class="chev">›</span></button>
  </div>
 </section>
</main>
<div class="toast" id="toast"></div>
<script>
const toast=document.getElementById("toast");backBtn.onclick=()=>{if(history.length>1){history.back()}else{window.location.href="about:blank"}};function tip(t){toast.textContent=t;toast.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>toast.classList.remove("show"),1600)}
enterBtn.onclick=()=>{const v=serial.value.trim();tip(v?`正在进入研究：${v}`:"请选择下方数据库，或输入研究序列号")};
serial.addEventListener("keydown",e=>{if(e.key==="Enter")enterBtn.click()});
document.querySelectorAll(".platform").forEach(x=>x.onclick=()=>{if(x.id==="fibroPlatform"){location.href="./纤维肌痛数据库-患者列表-H5.html"}else{tip("进入 "+x.dataset.name)}});
</script>
</body></html>
