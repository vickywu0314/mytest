<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>新增患者</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f7f8fa;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
button,input{font:inherit}body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.app-header{position:sticky;top:0;z-index:30;height:52px;background:#fff;border-bottom:1px solid #e6eaf0;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:0 4px}
.app-title{text-align:center;font-size:17px;font-weight:650}.back-btn{width:44px;height:44px;border:0;background:transparent;color:#374151;display:grid;place-items:center;border-radius:9px;cursor:pointer}.back-btn:active{background:#f2f4f8}.header-space{width:48px}
main{max-width:680px;margin:auto;padding:20px 14px 92px}.eyebrow{font-size:13px;color:#8a93a3}.lead{font-size:22px;font-weight:700;margin-top:5px}.sub{font-size:12px;color:#8a93a3;line-height:1.6;margin-top:7px}
.card{background:#fff;border:1px solid #e6eaf0;border-radius:14px;padding:17px}.form-card{margin-top:18px}.field{margin-bottom:18px}.field:last-child{margin-bottom:0}.label{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:650;margin-bottom:8px}.req{color:#d93025}
.input{width:100%;height:44px;border:1px solid #dfe4ec;border-radius:9px;padding:0 12px;outline:0;background:#fff;color:#374151}.input:focus{border-color:#0b57d0;box-shadow:0 0 0 3px rgba(11,87,208,.08)}.input.error{border-color:#d93025}.hint{font-size:11px;color:#8a93a3;margin-top:6px;line-height:1.5}.error-text{font-size:11px;color:#d93025;margin-top:6px;display:none}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,#f7f8fa 72%,rgba(247,248,250,0));z-index:20}.primary{display:block;width:min(100%,652px);height:46px;margin:auto;border:0;border-radius:9px;background:#0b57d0;color:#fff;font-weight:650;cursor:pointer;box-shadow:0 5px 14px rgba(11,87,208,.18)}.primary:disabled{background:#a9c4ee;box-shadow:none}
.patient-card{margin-top:16px;display:flex;align-items:center;gap:12px}.avatar{width:46px;height:46px;border-radius:12px;background:#eaf1fd;color:#1257c4;display:grid;place-items:center;font-weight:700;font-size:17px}.pbody{flex:1}.pname{font-size:18px;font-weight:700}.pid{font-size:11px;color:#8a93a3;margin-top:4px}.history{font-size:12px;color:#1257c4;font-weight:650;cursor:pointer}
.progress-card{margin-top:10px}.progress-top{display:flex;align-items:center;justify-content:space-between}.progress-title{font-size:13px;font-weight:650}.progress-num{font-size:12px;color:#8a93a3}.bar{height:7px;background:#edf1f6;border-radius:999px;overflow:hidden;margin-top:11px}.bar i{display:block;height:100%;width:14.3%;background:#0b57d0;border-radius:999px}
.group{margin-top:24px}.group-title{font-size:13px;color:#8a93a3;font-weight:650;margin:0 4px 9px}.module-card{background:#fff;border:1px solid #e6eaf0;border-radius:14px;overflow:hidden}.module{width:100%;border:0;background:#fff;display:flex;align-items:center;gap:12px;padding:15px 14px;text-align:left;color:#111827;cursor:pointer;border-bottom:1px solid #eef1f5}.module:last-child{border-bottom:0}.module:active{background:#fafbfc}
.state{width:28px;height:28px;border-radius:8px;background:#f2f4f8;color:#8a93a3;display:grid;place-items:center;font-size:13px;flex:none}.state.done{background:#eaf1fd;color:#1257c4;font-weight:700}.mbody{flex:1;min-width:0}.mname{font-size:15px;font-weight:650}.mdesc{font-size:11px;color:#8a93a3;margin-top:4px}.chev{font-size:22px;color:#a0a7b4}.toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));transform:translate(-50%,12px);background:#111827;color:#fff;font-size:12px;padding:9px 13px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap;z-index:50}.toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body>
<header class="app-header"><button class="back-btn" id="backBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><div class="app-title">新增患者</div><div class="header-space"></div></header>
<main>
<div class="eyebrow">患者建档</div><div class="lead">建立患者档案</div><div class="sub">填写患者姓名与身份证号，创建档案后继续录入患者的临床资料。</div>
<section class="card form-card">
 <div class="field"><div class="label">患者姓名 <span class="req">*</span></div><input class="input" id="name" placeholder="请输入患者姓名" autocomplete="name"><div class="error-text" id="nameErr">请输入患者姓名</div></div>
 <div class="field"><div class="label">身份证号 <span class="req">*</span></div><input class="input" id="idno" placeholder="请输入18位身份证号码" maxlength="18" inputmode="text"><div class="hint">18 位身份证号：前 17 位为数字，最后 1 位为数字或 X。</div><div class="error-text" id="idErr">身份证号码格式不正确</div></div>
</section>
</main>
<div class="bottom"><button class="primary" id="createBtn">创建患者档案</button></div>
<script>
const backBtn = document.getElementById("backBtn");
const createBtn = document.getElementById("createBtn");
const nameInput = document.getElementById("name");
const idInput = document.getElementById("idno");
const nameErr = document.getElementById("nameErr");
const idErr = document.getElementById("idErr");

backBtn.addEventListener("click", function () {
  window.location.href = "./纤维肌痛数据库-患者列表-H5.html";
});

function validID(v) {
  return /^\d{17}[\dXx]$/.test(v);
}

createBtn.addEventListener("click", function () {
  const patientName = nameInput.value.trim();
  const patientId = idInput.value.trim();

  const nameOK = patientName.length > 0;
  const idOK = validID(patientId);

  nameInput.classList.toggle("error", !nameOK);
  nameErr.style.display = nameOK ? "none" : "block";

  idInput.classList.toggle("error", !idOK);
  idErr.style.display = idOK ? "none" : "block";

  if (!nameOK || !idOK) return;

  window.location.href = "./纤维肌痛数据库-患者资料-H5.html";
});
</script></body></html>
