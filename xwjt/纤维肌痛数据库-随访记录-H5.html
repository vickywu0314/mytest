<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>随访记录</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f7f8fa;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
button,input{font:inherit}body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.app-header{position:sticky;top:0;z-index:30;height:52px;background:#fff;border-bottom:1px solid #e6eaf0;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:0 4px}
.app-title{text-align:center;font-size:17px;font-weight:650;color:#111827;white-space:nowrap}.back-btn{width:44px;height:44px;border:0;background:transparent;color:#374151;display:grid;place-items:center;border-radius:9px;padding:0;cursor:pointer}.back-btn:active{background:#f2f4f8}.header-space{width:48px}
main{max-width:680px;margin:auto;padding:16px 14px 92px}.sub{font-size:13px;color:#8a93a3;line-height:1.6}
.searchbox{height:44px;background:#fff;border:1px solid #dfe4ec;border-radius:10px;display:flex;align-items:center;gap:9px;padding:0 12px;margin-bottom:14px}.searchbox svg{color:#8a93a3;flex:none}.searchbox input{border:0;outline:0;min-width:0;flex:1;color:#374151;background:transparent}.searchbox input::placeholder{color:#a7afbc}
.list{display:flex;flex-direction:column;gap:10px}.card{width:100%;background:#fff;border:1px solid #e6eaf0;border-radius:14px;padding:16px;text-align:left;color:#111827;cursor:pointer}.card:active{background:#fafbfc;transform:scale(.995)}
.rowtop{display:flex;align-items:center;gap:10px}.name{font-size:17px;font-weight:700;flex:1}.chev{font-size:24px;color:#1257c4;line-height:1}.meta{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:12px;color:#8a93a3}.meta span:last-child{white-space:nowrap}
.fabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,#f7f8fa 70%,rgba(247,248,250,0))}
.primary{display:block;width:min(100%,652px);height:46px;margin:auto;border:0;border-radius:9px;background:#0b57d0;color:#fff;font-weight:650;box-shadow:0 5px 14px rgba(11,87,208,.18);cursor:pointer}
.visit-card{min-height:76px;display:flex;align-items:center;width:100%}.visit-card>div:first-child{flex:1;min-width:0}.visit-card>.chev{margin-left:auto;flex:none;align-self:center;text-align:right;padding-left:16px}.visit-date{font-size:16px;font-weight:700;flex:1}.visit-label{font-size:11px;color:#8a93a3;margin-bottom:4px}.empty{padding:40px 12px;text-align:center;color:#8a93a3;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom));transform:translate(-50%,15px);background:#111827;color:#fff;font-size:12px;padding:9px 13px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:60;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
.patient-context{background:#eaf1fd;color:#1257c4;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:12px;font-weight:650}</style></head><body>
<header class="app-header"><button class="back-btn" id="backBtn" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><div class="app-title">随访记录</div><div class="header-space"></div></header>
<main><div class="patient-context" id="patientName">患者</div><div class="list" id="visits">
<button class="card visit-card" data-date="2020-10-15"><div><div class="visit-label">随访日期</div><div class="visit-date">2020-10-15</div></div><div class="chev">›</div></button>
<button class="card visit-card" data-date="2020-09-15"><div><div class="visit-label">随访日期</div><div class="visit-date">2020-09-15</div></div><div class="chev">›</div></button>
<button class="card visit-card" data-date="2020-08-15"><div><div class="visit-label">随访日期</div><div class="visit-date">2020-08-15</div></div><div class="chev">›</div></button>
<button class="card visit-card" data-date="2020-07-15"><div><div class="visit-label">随访日期</div><div class="visit-date">2020-07-15</div></div><div class="chev">›</div></button>
<button class="card visit-card" data-date="2020-06-15"><div><div class="visit-label">随访日期</div><div class="visit-date">2020-06-15</div></div><div class="chev">›</div></button>
</div></main>
<div class="fabbar"><button class="primary" id="addVisit">新增随访记录</button></div><div class="toast" id="toast"></div>
<script>
const params=new URLSearchParams(location.search),name=params.get("name")||"患者";patientName.textContent="当前患者："+name;
backBtn.onclick=()=>location.href="./纤维肌痛数据库-患者列表-H5.html";
const toast=document.getElementById("toast");function tip(t){toast.textContent=t;toast.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>toast.classList.remove("show"),1500)}
document.querySelectorAll(".visit-card").forEach(r=>r.onclick=()=>tip(name+" · "+r.dataset.date+" 随访记录"));
addVisit.onclick=()=>tip("为 "+name+" 新增随访记录");
</script></body></html>
