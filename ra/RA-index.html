<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RA 研究数据平台</title>
<style>
html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f8fb}
body{display:grid;place-items:center;color:#667085}.loading{font-size:14px}

<script>
(function () {
  var ua = navigator.userAgent || "";
  var isPhoneUA = /iPhone|iPod|Android.*Mobile|Windows Phone|Mobile/i.test(ua);
  var isIPad = /iPad/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var narrowTouch = (window.matchMedia && matchMedia("(max-width: 767px) and (pointer: coarse)").matches);
  var useH5 = !isIPad && (isPhoneUA || narrowTouch);
  var target = useH5 ? "./RA-index-blue-H5.html" : "./RA-index-blue-web.html";
  location.replace(target + location.search + location.hash);
})();
</script>
</head>
