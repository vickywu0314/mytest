<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>基本信息</title>
<style>
:root{
  --primary:#3A66DB; --primary-weak:#EDF2FD; --teal:#2E7B76;
  --ink:#1C2230; --sub:#687182; --line:#E4E8EE; --bg:#F2F4F7; --error:#D6453D;
  --radius:8px; --stick:120px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei",sans-serif;
  color:var(--ink);background:#E9ECF1;font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:calc(84px + env(safe-area-inset-bottom))}

/* ===== 顶部固定区 ===== */
.topbar{position:sticky;top:0;z-index:20;background:#fff;box-shadow:0 1px 0 var(--line)}
.nav{height:44px;display:flex;align-items:center;justify-content:center;position:relative;padding-top:env(safe-area-inset-top)}
.nav h1{font-size:17px;font-weight:600}
.back{position:absolute;left:4px;bottom:0;width:44px;height:44px;display:grid;place-items:center}
.progress{padding:4px 16px 10px}
.bar{height:6px;border-radius:3px;background:#E3E7EE;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:3px;transition:width .4s ease}
.progress p{font-size:12px;color:var(--sub);margin-top:6px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:22px;overflow-x:auto;padding:0 16px;scrollbar-width:none;border-top:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:40px;display:flex;align-items:center;gap:4px;font-size:14px;color:var(--sub);position:relative;white-space:nowrap}
.tab.active{color:var(--ink);font-weight:600}
.tab.active::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--primary);border-radius:1px}
.tab svg{width:13px;height:13px;color:var(--primary);display:none}
.tab.done svg{display:block}

/* ===== 模块 / 问题 ===== */
.module{scroll-margin-top:var(--stick)}
.mod-title{font-size:17px;font-weight:600;padding:22px 16px 8px}
.group{background:#fff;margin-bottom:10px}
.q-title{font-size:15px;font-weight:600;padding:14px 16px 6px}
.q-err{font-size:12px;color:var(--error);padding:0 16px 8px;display:none}
.q-block.show-err .q-err{display:block}
.ref{padding:6px 16px 10px}
.zoomable{position:relative;display:inline-block;border-radius:6px;overflow:hidden;cursor:zoom-in;max-width:100%}
.zoomable img{display:block;width:100%;max-width:300px}
.zoomable .zoom-ic{position:absolute;right:6px;bottom:6px;width:26px;height:26px;border-radius:13px;background:rgba(0,0,0,.45);display:grid;place-items:center}
.sentinel{height:1px}

/* ===== 食物项 ===== */
.item{position:relative;scroll-margin-top:calc(var(--stick) + 8px)}
.item+.item::before{content:"";position:absolute;top:0;left:56px;right:0;height:1px;background:var(--line)}
.item-head{display:flex;align-items:stretch;min-height:52px}
.tick{flex:none;width:52px;display:grid;place-items:center}
.tick span{width:20px;height:20px;border-radius:50%;border:1.5px solid #C4CAD4;display:grid;place-items:center;transition:background .15s,border-color .15s}
.tick svg{width:12px;height:12px;color:#fff;opacity:0}
.item.on .tick span{background:var(--primary);border-color:var(--primary)}
.item.on .tick svg{opacity:1}
.expand{flex:1;display:flex;align-items:center;gap:8px;text-align:left;padding:12px 16px 12px 0;min-width:0}
.expand .txt{flex:1;min-width:0}
.expand .label{display:block;font-size:15px}
.expand .val{display:block;font-size:13px;color:var(--primary);margin-top:2px}
.expand .val:empty{display:none}
.chev{flex:none;width:16px;height:16px;color:#A3AAB6;transition:transform .2s}
.item.open .chev{transform:rotate(180deg)}
.item:not(.on) .chev{visibility:hidden}
.item.missing{box-shadow:inset 3px 0 0 var(--error)}
.item-err{display:none;font-size:12px;color:var(--error);padding:0 16px 10px 52px;margin-top:-6px}
.item.missing .item-err{display:block}

.reveal{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease}
.reveal>div{overflow:hidden}
.open>.reveal,.reveal.open{grid-template-rows:1fr}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:2px 16px 14px 52px}
.opt{min-height:40px;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);font-size:14px;text-align:left;background:#fff;transition:border-color .15s,background .15s}
.opt .dot{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid #C4CAD4;position:relative}
.opt[aria-checked="true"]{border-color:var(--primary);background:var(--primary-weak);color:var(--primary)}
.opt[aria-checked="true"] .dot{border-color:var(--primary)}
.opt[aria-checked="true"] .dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--primary)}
.opt-wide{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.opt-wide .opt{flex:1 1 auto}
.num{width:84px;height:40px;border:1px solid var(--line);border-radius:var(--radius);text-align:center;font-size:15px;background:#fff;outline:none;font-variant-numeric:tabular-nums}
.num:focus{border-color:var(--primary)}
.num.bad{border-color:var(--error)}

/* ===== 鱼油/DHA & 其他食物 ===== */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 16px 14px}
.brands{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px}
.brand{border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:left;background:#fff;transition:border-color .15s}
.brand .pic{height:104px;display:grid;place-items:center;background:#fff}
.brand .pic img{max-height:92px;max-width:88%;object-fit:contain}
.brand .name{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:14px;border-top:1px solid var(--line)}
.brand[aria-checked="true"]{border-color:var(--primary)}
.brand[aria-checked="true"] .name{background:var(--primary-weak);color:var(--primary)}
.brand[aria-checked="true"] .dot{border-color:var(--primary)}
.brand[aria-checked="true"] .dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--primary)}
.brand .dot{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid #C4CAD4;position:relative}
.brand-other{grid-column:1/-1;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 0}
.brand-other.sel{border-color:var(--primary);background:var(--primary-weak)}
.brand-other .opt{border:0;background:none;flex:none}
.brand-other input{flex:1;min-width:0;height:36px;border:1px solid var(--line);border-radius:6px;padding:0 10px;background:#fff;outline:none}
.brand-other input:focus{border-color:var(--primary)}

.form{padding:0 16px 16px}
.row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.row label{flex:none;width:36px;font-size:15px}
.row input{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:var(--radius);padding:0 10px;outline:none;background:#fff}
.row input:focus{border-color:var(--primary)}
.row input.bad{border-color:var(--error)}
.row .unit{flex:none;font-size:14px;color:var(--ink)}
.form-err{font-size:12px;color:var(--error);margin:-4px 0 8px 46px;min-height:0}
.form-err:empty{display:none}
.add{display:block;margin:6px auto 0;width:160px;height:40px;border-radius:var(--radius);background:var(--teal);color:#fff;font-size:15px;font-weight:500}
.add:active{opacity:.85}
.foods{list-style:none;margin-top:14px}
.foods li{display:flex;align-items:center;gap:10px;min-height:44px;border-top:1px solid var(--line);font-size:14px}
.foods li .n{flex:1;min-width:0;word-break:break-all}
.foods li .w{color:var(--sub);font-variant-numeric:tabular-nums}
.foods li button{width:36px;height:36px;display:grid;place-items:center;color:#A3AAB6}

/* ===== 底部 ===== */
.footer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;box-shadow:0 -1px 0 var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.footer .inner{max-width:448px;margin:0 auto}
.save{width:100%;height:46px;border-radius:var(--radius);background:var(--primary);color:#fff;font-size:16px;font-weight:500}
.save:disabled{opacity:.6}

/* ===== 弹层 ===== */
.mask{position:fixed;inset:0;z-index:50;background:rgba(18,22,30,.5);display:none;align-items:center;justify-content:center;padding:24px}
.mask.show{display:flex}
.dialog{width:100%;max-width:300px;background:#fff;border-radius:12px;overflow:hidden;text-align:center}
.dialog h3{font-size:16px;font-weight:600;padding:22px 20px 6px}
.dialog p{font-size:14px;color:var(--sub);padding:0 20px 20px}
.dialog .btns{display:flex;border-top:1px solid var(--line)}
.dialog .btns button{flex:1;height:48px;font-size:16px}
.dialog .btns button+button{border-left:1px solid var(--line);color:var(--primary);font-weight:500}
.dialog .btns button.danger{color:var(--error)}
.toast{position:fixed;left:50%;top:45%;z-index:60;transform:translate(-50%,-50%);background:rgba(28,34,48,.9);color:#fff;font-size:14px;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:80vw;text-align:center}
.toast.show{opacity:1}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;cursor:zoom-out;touch-action:pinch-zoom}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:100%}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">

  <header class="topbar" id="topbar">
    <div class="nav">
      <button class="back" id="backBtn" aria-label="返回">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h1>基本信息</h1>
    </div>
    <div class="progress">
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="bar"><i id="barFill"></i></div>
      <p id="barText">已完成30%</p>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>

  <main id="main"></main>
</div>

<div class="footer"><div class="inner"><button class="save" id="saveBtn">保存</button></div></div>

<div class="mask" id="mask" role="dialog" aria-modal="true">
  <div class="dialog"><h3 id="dlgTitle"></h3><p id="dlgBody"></p>
    <div class="btns"><button id="dlgCancel"></button><button id="dlgOk"></button></div></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="lightbox" id="lightbox"><img alt=""></div>

/* ================= 状态 ================= */
const S = { items:{}, open:{}, touched:{}, seen:{}, dha:null, brand:null, brandOther:'', other:null, foods:[], dirty:false, tried:false };
MODULES.forEach(m => m.items.forEach(([id]) => S.items[id] = {on:false, f:null, q:null, v:''}));
const itemMod = {}; MODULES.forEach(m => m.items.forEach(([id,label]) => itemMod[id] = {m, label}));

const $ = (s, r=document) => r.querySelector(s);
const h = (tag, attrs={}, html='') => { const e=document.createElement(tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (html) e.innerHTML=html; return e; };
const ICON_CHECK = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.2l2.3 2.3 4.7-5"/></svg>';
const ICON_CHEV = '<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>';
const ICON_ZOOM = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4M11 8v6M8 11h6"/></svg>';

/* ================= 校验 ================= */
function numOk(v, rule){ if (v==='' || isNaN(+v)) return false; return rule.gt ? +v > rule.min : +v >= rule.min; }
function freqDone(id){ const s=S.items[id]; return !s.on || s.f!==null; }
function qtyDone(id){ const s=S.items[id]; if(!s.on) return true; if(s.q===null) return false; const o=itemMod[id].m.qty[s.q]; return !o.input || numOk(s.v, o.input); }
function blockDone(m, kind){
  const on = m.items.filter(([id]) => S.items[id].on);
  if (!on.length) return !!S.seen[m.id+':'+kind];
  return on.every(([id]) => kind==='f' ? freqDone(id) : qtyDone(id));
}
function dhaDone(){ return S.dha==='no' || (S.dha==='yes' && S.brand && (S.brand!=='other' || S.brandOther.trim()!=='')); }
function otherDone(){ return S.other==='no' || (S.other==='yes' && S.foods.length>0); }

/* ================= 构建 DOM ================= */
function buildTabs(){
  const nav = $('#tabs');
  TABS.forEach(([id,label]) => {
    const b = h('button',{class:'tab','data-target':id}, `${label}<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.2l2.3 2.3 4.7-5"/></svg>`);
    b.onclick = () => scrollToEl(document.getElementById('mod-'+id));
    nav.appendChild(b);
  });
}

function buildItem(m, id, label, kind){
  const el = h('div',{class:'item','data-id':id,'data-kind':kind});
  const opts = kind==='f' ? FREQ.map(t=>({t})) : m.qty;
  const optHtml = opts.map((o,i) => {
    const btn = `<button class="opt" role="radio" aria-checked="false" data-i="${i}"><span class="dot"></span><span>${o.t}</span></button>`;
    return o.input ? `<div class="opt-wide">${btn}<input class="num" inputmode="decimal" maxlength="6" data-i="${i}" aria-label="${o.t}"></div>` : btn;
  }).join('');
  el.innerHTML = `
    <div class="item-head">
      <button class="tick" role="checkbox" aria-checked="false" aria-label="${label}"><span>${ICON_CHECK}</span></button>
      <button class="expand" aria-expanded="false"><span class="txt"><span class="label">${label}</span><span class="val"></span></span>${ICON_CHEV}</button>
    </div>
    <div class="item-err"></div>
    <div class="reveal"><div><div class="opts" role="radiogroup" aria-label="${label}">${optHtml}</div></div></div>`;

  $('.tick', el).onclick = () => { S.items[id].on ? turnOff(id) : turnOn(id, kind); sync(id); };
  $('.expand', el).onclick = () => {
    const s = S.items[id], k = id+':'+kind;
    if (!s.on) turnOn(id, kind); else S.open[k] = !S.open[k];
    sync(id);
  };
  el.querySelectorAll('.opt').forEach(b => b.onclick = () => pick(id, kind, +b.dataset.i));
  const inp = $('.num', el);
  if (inp) {
    const i = +inp.dataset.i;
    inp.addEventListener('focus', () => { if (S.items[id].q !== i) pick(id, 'q', i, true); });
    inp.addEventListener('input', () => {
      let v = inp.value.replace(/[^\d.]/g,'').replace(/(\..*)\./g,'$1').replace(/^(\d*\.\d).*$/,'$1');
      inp.value = v; S.items[id].v = v; S.dirty = true; syncItemEls(id); meta();
    });
    inp.addEventListener('blur', () => { S.touched[id] = true; syncItemEls(id); });
  }
  refs[id] = refs[id] || {}; refs[id][kind] = el;
  return el;
}

function buildFoodModule(m){
  const sec = h('section',{class:'module',id:'mod-'+m.id});
  sec.appendChild(h('h2',{class:'mod-title'}, m.name));
  ['f','q'].forEach(kind => {
    const g = h('div',{class:'group q-block','data-block':m.id+':'+kind});
    g.appendChild(h('h3',{class:'q-title'}, kind==='f' ? m.freqTitle : m.qtyTitle));
    if (kind==='q' && m.img) g.appendChild(h('div',{class:'ref'}, `<button class="zoomable" data-src="${m.img}" aria-label="查看大图"><img src="${m.img}" alt=""><span class="zoom-ic">${ICON_ZOOM}</span></button>`));
    m.items.forEach(([id,label]) => g.appendChild(buildItem(m, id, label, kind)));
    g.appendChild(h('div',{class:'sentinel','data-seen':m.id+':'+kind}));
    sec.appendChild(g);
  });
  return sec;
}

function buildDha(){
  const sec = h('section',{class:'module',id:'mod-dha'});
  sec.innerHTML = `
    <h2 class="mod-title">鱼油/DHA</h2>
    <div class="group q-block" id="dhaBlock">
      <h3 class="q-title">在过去一年内您是否服用鱼油/DHA补充剂?</h3>
      <div class="q-err" id="dhaErr"></div>
      <div class="pair" role="radiogroup">
        <button class="opt" role="radio" aria-checked="false" data-v="no"><span class="dot"></span>无</button>
        <button class="opt" role="radio" aria-checked="false" data-v="yes"><span class="dot"></span>有</button>
      </div>
      <div class="reveal" id="dhaReveal"><div>
        <div class="brands" role="radiogroup">
          ${BRANDS.map(([k,n,src]) => `<button class="brand" role="radio" aria-checked="false" data-b="${k}"><div class="pic"><img src="${src}" alt="${n}"></div><div class="name"><span class="dot"></span>${n}</div></button>`).join('')}
          <div class="brand-other" id="brandOther"><button class="opt" role="radio" aria-checked="false" data-b="other"><span class="dot"></span>其他</button><input id="brandOtherInput" maxlength="30" aria-label="其他"></div>
        </div>
      </div></div>
    </div>`;
  sec.querySelectorAll('.pair .opt').forEach(b => b.onclick = () => {
    S.dha = b.dataset.v; if (S.dha==='no') { S.brand=null; S.brandOther=''; $('#brandOtherInput').value=''; }
    S.dirty = true; syncDha(); meta();
  });
  sec.querySelectorAll('[data-b]').forEach(b => b.onclick = () => {
    S.brand = b.dataset.b; S.dirty = true; syncDha(); meta();
    if (S.brand==='other') $('#brandOtherInput').focus();
  });
  const inp = $('#brandOtherInput', sec);
  inp.addEventListener('focus', () => { if (S.brand!=='other') { S.brand='other'; syncDha(); meta(); } });
  inp.addEventListener('input', () => { S.brandOther = inp.value; S.dirty = true; syncDha(); meta(); });
  return sec;
}

function buildOther(){
  const sec = h('section',{class:'module',id:'mod-other'});
  sec.innerHTML = `
    <div class="group q-block" id="otherBlock" style="margin-top:12px">
      <h3 class="q-title">过去一年里经常吃，但问卷中没有的食物</h3>
      <div class="q-err" id="otherErr"></div>
      <div class="pair" role="radiogroup">
        <button class="opt" role="radio" aria-checked="false" data-v="no"><span class="dot"></span>无</button>
        <button class="opt" role="radio" aria-checked="false" data-v="yes"><span class="dot"></span>有</button>
      </div>
      <div class="reveal" id="otherReveal"><div>
        <div class="form">
          <div class="row"><label for="foodName">名称</label><input id="foodName" maxlength="20"></div>
          <div class="form-err" id="nameErr"></div>
          <div class="row"><label for="foodWeight">重量</label><input id="foodWeight" inputmode="decimal" maxlength="6"><span class="unit">两（1两=25g）</span></div>
          <div class="form-err" id="weightErr"></div>
          <button class="add" id="addBtn">添加食物</button>
          <ul class="foods" id="foodList"></ul>
        </div>
      </div></div>
    </div>`;
  sec.querySelectorAll('.pair .opt').forEach(b => b.onclick = () => {
    const v = b.dataset.v;
    if (v==='no' && S.foods.length) {
      dialog({title:'切换为「无」？', body:`已添加的 ${S.foods.length} 种食物将被清空。`, cancel:'取消', ok:'清空', danger:true,
        onOk:()=>{ S.foods=[]; S.other='no'; clearFoodForm(); S.dirty=true; syncOther(); meta(); }});
      return;
    }
    S.other = v; if (v==='no') clearFoodForm(); S.dirty = true; syncOther(); meta();
  });
  const w = $('#foodWeight', sec), n = $('#foodName', sec);
  w.addEventListener('input', () => { w.value = w.value.replace(/[^\d.]/g,'').replace(/(\..*)\./g,'$1').replace(/^(\d*\.\d).*$/,'$1'); $('#weightErr').textContent=''; w.classList.remove('bad'); });
  n.addEventListener('input', () => { $('#nameErr').textContent=''; n.classList.remove('bad'); });
  $('#addBtn', sec).onclick = () => addFood();
  return sec;
}

/* ================= 交互动作 ================= */
function turnOn(id, kind){
  const s = S.items[id]; s.on = true;
  S.open[id+':f'] = s.f===null; S.open[id+':q'] = s.q===null;
  S.open[id+':'+kind] = true; S.dirty = true;
}
function turnOff(id){
  Object.assign(S.items[id], {on:false, f:null, q:null, v:''});
  S.open[id+':f'] = S.open[id+':q'] = false; S.touched[id] = false; S.dirty = true;
}
function pick(id, kind, i, fromInput){
  const s = S.items[id];
  if (!s.on) turnOn(id, kind);
  if (kind==='f') {
    s.f = i; if (s.q===null) S.open[id+':q'] = true;
    sync(id);
    setTimeout(() => { if (S.items[id].f===i) { S.open[id+':f']=false; sync(id); } }, 240);
  } else {
    s.q = i; const o = itemMod[id].m.qty[i];
    if (!o.input) { s.v=''; const inp=$('.num', refs[id].q); if (inp) inp.value=''; }
    sync(id);
    if (o.input && !fromInput) $('.num', refs[id].q).focus();
    if (!o.input) setTimeout(() => { if (S.items[id].q===i) { S.open[id+':q']=false; sync(id); } }, 240);
  }
  S.dirty = true;
}

function addFood(silent){
  const n=$('#foodName'), w=$('#foodWeight');
  const name=n.value.trim(), wt=w.value.trim();
  let ok = true;
  if (!name) { $('#nameErr').textContent='请填写名称'; n.classList.add('bad'); ok=false; }
  else if (S.foods.some(f=>f.name===name)) { $('#nameErr').textContent='已添加过该食物'; n.classList.add('bad'); ok=false; }
  if (!wt || !(+wt>0)) { $('#weightErr').textContent='请填写大于0的重量'; w.classList.add('bad'); ok=false; }
  if (!ok) return false;
  S.foods.push({name, weight:+wt}); clearFoodForm(); S.dirty=true; syncOther(); meta();
  if (!silent) toast('已添加'); return true;
}
function clearFoodForm(){ ['#foodName','#foodWeight'].forEach(s=>{ $(s).value=''; $(s).classList.remove('bad'); }); $('#nameErr').textContent=''; $('#weightErr').textContent=''; }

/* ================= 视图同步 ================= */
function syncItemEls(id){
  const s = S.items[id], {m} = itemMod[id];
  ['f','q'].forEach(kind => {
    const el = refs[id][kind], open = s.on && !!S.open[id+':'+kind];
    el.classList.toggle('on', s.on);
    el.classList.toggle('open', open);
    $('.tick', el).setAttribute('aria-checked', s.on);
    $('.expand', el).setAttribute('aria-expanded', open);
    $('.reveal', el).inert = !open;
    el.querySelectorAll('.opt').forEach(b => b.setAttribute('aria-checked', (kind==='f' ? s.f : s.q) === +b.dataset.i));
    // 摘要
    let val = '';
    if (kind==='f' && s.f!==null) val = FREQ[s.f];
    if (kind==='q' && s.q!==null) { const o=m.qty[s.q]; val = o.input ? `${o.t.split(/[（(]/)[0]}（${s.v || '待填写'}）` : o.t; }
    $('.val', el).textContent = s.on ? val : '';
    // 错误
    let err = '';
    if (kind==='f' && !freqDone(id) && S.tried) err = '请选择';
    if (kind==='q' && s.on) {
      if (s.q===null) { if (S.tried) err = '请选择'; }
      else { const o=m.qty[s.q]; if (o.input && !numOk(s.v,o.input) && (S.tried || S.touched[id])) err = o.input.err; }
    }
    const inp = $('.num', el);
    if (inp) inp.classList.toggle('bad', kind==='q' && s.q!==null && !!m.qty[s.q].input && !!err);
    el.classList.toggle('missing', !!err);
    $('.item-err', el).textContent = err;
  });
}
function sync(id){ syncItemEls(id); meta(); }

function syncDha(){
  const blk = $('#dhaBlock');
  blk.querySelectorAll('.pair .opt').forEach(b => b.setAttribute('aria-checked', S.dha===b.dataset.v));
  const rv = $('#dhaReveal'); rv.classList.toggle('open', S.dha==='yes'); rv.inert = S.dha!=='yes';
  blk.querySelectorAll('[data-b]').forEach(b => b.setAttribute('aria-checked', S.brand===b.dataset.b));
  $('#brandOther').classList.toggle('sel', S.brand==='other');
  let err = '';
  if (S.tried && !dhaDone()) err = S.dha===null ? '请选择' : (!S.brand ? '请选择补充剂' : '请填写其他补充剂名称');
  $('#dhaErr').textContent = err; blk.classList.toggle('show-err', !!err);
}
function syncOther(){
  const blk = $('#otherBlock');
  blk.querySelectorAll('.pair .opt').forEach(b => b.setAttribute('aria-checked', S.other===b.dataset.v));
  const rv = $('#otherReveal'); rv.classList.toggle('open', S.other==='yes'); rv.inert = S.other!=='yes';
  const ul = $('#foodList'); ul.innerHTML = '';
  S.foods.forEach((f,i) => {
    const li = h('li',{}, `<span class="n"></span><span class="w">${f.weight}两</span><button aria-label="删除"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`);
    $('.n', li).textContent = f.name;
    $('button', li).onclick = () => { S.foods.splice(i,1); S.dirty=true; syncOther(); meta(); };
    ul.appendChild(li);
  });
  let err = '';
  if (S.tried && !otherDone()) err = S.other===null ? '请选择' : '请添加食物';
  $('#otherErr').textContent = err; blk.classList.toggle('show-err', !!err);
}

function meta(){
  const blocks = [];
  MODULES.forEach(m => { blocks.push(blockDone(m,'f'), blockDone(m,'q')); });
  blocks.push(dhaDone(), otherDone());
  const done = blocks.filter(Boolean).length;
  const p = Math.round(CFG.PROGRESS_START + done / blocks.length * (CFG.PROGRESS_END - CFG.PROGRESS_START));
  $('#barFill').style.width = p + '%'; $('#barText').textContent = `已完成${p}%`; $('#bar').setAttribute('aria-valuenow', p);
  const tabDone = { dha:dhaDone(), other:otherDone() };
  MODULES.forEach(m => tabDone[m.id] = blockDone(m,'f') && blockDone(m,'q'));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('done', !!tabDone[t.dataset.target]));
  if (S.tried) { syncDha(); syncOther(); }
}

/* ================= 保存 ================= */
function collectMissing(){
  const list = [];
  MODULES.forEach(m => ['f','q'].forEach(kind => m.items.forEach(([id]) => {
    const ok = kind==='f' ? freqDone(id) : qtyDone(id);
    if (!ok) { S.open[id+':'+kind] = true; list.push(refs[id][kind]); }
  })));
  // 按页面顺序：f 块在 q 块之前
  list.sort((a,b) => a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING ? -1 : 1);
  if (!dhaDone()) list.push($('#dhaBlock'));
  if (!otherDone()) list.push($('#otherBlock'));
  return list;
}

function onSave(stage=0){
  // 0：其他食物表单有未添加内容
  if (stage<=0 && S.other==='yes' && ($('#foodName').value.trim() || $('#foodWeight').value.trim())) {
    dialog({title:'有未添加的食物', body:'名称或重量已填写，但还没有点击「添加食物」。', cancel:'不添加', ok:'添加',
      onCancel:()=>{ clearFoodForm(); onSave(1); },
      onOk:()=>{ if (addFood(true)) onSave(1); else scrollToEl($('#otherBlock')); }});
    return;
  }
  // 1：必填校验
  S.tried = true;
  const missing = collectMissing();
  Object.keys(S.items).forEach(syncItemEls); syncDha(); syncOther(); meta();
  if (missing.length) { toast(`还有${missing.length}项未完成`); scrollToEl(missing[0]); return; }
  // 2：整类未选择任何食物，二次确认
  const empty = MODULES.filter(m => !m.items.some(([id]) => S.items[id].on)).map(m => `「${m.name}」`);
  if (stage<2 && empty.length) {
    dialog({title:'确认保存', body:`${empty.join('、')}未选择任何食物，将记为过去一年未食用。`, cancel:'返回修改', ok:'确认保存', onOk:()=>doSave()});
    return;
  }
  doSave();
}
function doSave(){
  MODULES.forEach(m => { S.seen[m.id+':f'] = S.seen[m.id+':q'] = true; }); meta();
  const btn = $('#saveBtn'); btn.disabled = true; btn.textContent = '保存中…';
  const payload = {
    foods: MODULES.flatMap(m => m.items.map(([id,label]) => { const s=S.items[id]; return {id, label, eaten:s.on, freq:s.f===null?null:FREQ[s.f], qty:s.q===null?null:m.qty[s.q].t, qtyInput:s.v||null}; })),
    dha: {taken:S.dha==='yes', brand:S.brand, brandOther:S.brandOther.trim()||null},
    otherFoods: S.other==='yes' ? S.foods : []
  };
  console.log('[提交数据]', payload);
  setTimeout(() => { btn.disabled=false; btn.textContent='保存'; S.dirty=false; toast('已保存'); }, 700);
}

/* ================= 通用组件 ================= */
let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1600); }
function dialog({title, body, cancel, ok, danger, onOk, onCancel}){
  const mask=$('#mask'); $('#dlgTitle').textContent=title; $('#dlgBody').textContent=body;
  const c=$('#dlgCancel'), o=$('#dlgOk'); c.textContent=cancel; o.textContent=ok; o.classList.toggle('danger', !!danger);
  const close = fn => () => { mask.classList.remove('show'); fn && fn(); };
  c.onclick = close(onCancel); o.onclick = close(onOk);
  mask.classList.add('show'); o.focus();
}
function stickH(){ return $('#topbar').offsetHeight; }
function scrollToEl(el){ if (!el) return; const y = el.getBoundingClientRect().top + window.scrollY - stickH() - 8; window.scrollTo({top:y, behavior:'smooth'}); }

/* ================= 初始化 ================= */
buildTabs();
const main = $('#main');
MODULES.forEach(m => main.appendChild(buildFoodModule(m)));
main.appendChild(buildDha());
main.appendChild(buildOther());
Object.keys(S.items).forEach(syncItemEls); syncDha(); syncOther(); meta();
document.documentElement.style.setProperty('--stick', stickH()+'px');

// 滚动越过、且未勾选任何食物的问题块，视为已浏览完成（用于进度计算；初始视口内的块不计）
function markSeen(){
  const top = stickH(); let changed = false;
  document.querySelectorAll('.sentinel:not([data-passed])').forEach(el => {
    if (el.getBoundingClientRect().top < top) { S.seen[el.dataset.seen] = true; el.dataset.passed = '1'; changed = true; }
  });
  if (changed) meta();
}
window.addEventListener('scroll', markSeen, {passive:true});

// 滚动时高亮当前 Tab
function activeTab(){
  const top = stickH() + 12; let cur = TABS[0][0];
  TABS.forEach(([id]) => { if (document.getElementById('mod-'+id).getBoundingClientRect().top <= top) cur = id; });
  if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 4) cur = TABS[TABS.length-1][0];
  document.querySelectorAll('.tab').forEach(t => {
    const on = t.dataset.target===cur;
    if (on && !t.classList.contains('active')) { const nav=$('#tabs'); nav.scrollTo({left: t.offsetLeft - (nav.clientWidth - t.offsetWidth)/2, behavior:'smooth'}); }
    t.classList.toggle('active', on);
  });
}
window.addEventListener('scroll', activeTab, {passive:true}); activeTab();

// 大图预览
document.addEventListener('click', e => { const z=e.target.closest('.zoomable'); if (z) { const lb=$('#lightbox'); $('img',lb).src=z.dataset.src; lb.classList.add('show'); } });
$('#lightbox').onclick = () => $('#lightbox').classList.remove('show');
document.addEventListener('keydown', e => { if (e.key==='Escape') { $('#lightbox').classList.remove('show'); $('#mask').classList.remove('show'); } });

$('#saveBtn').onclick = () => onSave(0);
$('#backBtn').onclick = () => {
  if (S.dirty) dialog({title:'返回上一页？', body:'本页填写的内容尚未保存，返回后将丢失。', cancel:'继续填写', ok:'返回', danger:true, onOk:()=>toast('返回上一页')});
  else toast('返回上一页');
};
window.addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue=''; } });
</script>
